version: 1
$comment: 由 scripts/seed_meta_from_existing.py 从 phase-transitions.json + state-schema.json#PhaseId 反向生成。DSL 是 Phase 2 引入的单一真相源；编译产出的
  phase-transitions.json 必须与原文件 byte-equal。
phases:
- id: INIT
  name: 初始化
  order: 0
  next: ANALYSE_PRODUCT
  canSkipTo: null
  autoFlow: true
  threeStepMode: false
- id: ANALYSE_PRODUCT
  name: 产品需求分析
  order: 1
  next: CLARIFY_PRODUCT
  canSkipTo: ANALYSE_TECH
  autoFlow: false
  threeStepMode: true
- id: CLARIFY_PRODUCT
  name: 产品需求澄清
  order: 2
  next: ANALYSE_TECH
  canSkipTo: null
  autoFlow: false
  threeStepMode: true
- id: ANALYSE_TECH
  name: 技术需求分析
  order: 3
  next: CLARIFY_TECH
  canSkipTo: ARCHITECT_BACKEND
  autoFlow: false
  threeStepMode: true
- id: CLARIFY_TECH
  name: 技术需求澄清
  order: 4
  next: ARCHITECT_BACKEND
  canSkipTo: null
  autoFlow: false
  threeStepMode: true
- id: ARCHITECT_BACKEND
  name: 后端架构设计
  order: 5
  next: CLARIFY_ARCH_BACKEND
  canSkipTo: ARCHITECT_FRONTEND
  autoFlow: false
  threeStepMode: true
- id: CLARIFY_ARCH_BACKEND
  name: 后端架构澄清
  order: 6
  next: ARCHITECT_FRONTEND
  canSkipTo: null
  autoFlow: false
  threeStepMode: true
- id: ARCHITECT_FRONTEND
  name: 前端架构设计
  order: 7
  next: CLARIFY_ARCH_FRONTEND
  canSkipTo: IMPLEMENT
  autoFlow: false
  threeStepMode: true
- id: CLARIFY_ARCH_FRONTEND
  name: 前端架构澄清
  order: 8
  next: IMPLEMENT
  canSkipTo: null
  autoFlow: false
  threeStepMode: true
- id: IMPLEMENT
  name: 代码实现
  order: 9
  next: BUILD_VERIFY
  canSkipTo: null
  autoFlow: false
  threeStepMode: true
- id: BUILD_VERIFY
  name: 编译验证
  order: 10
  next: VISUAL_REVIEW
  canSkipTo: E2E_VERIFY
  autoFlow: false
  threeStepMode: true
- id: VISUAL_REVIEW
  name: 视觉验收
  order: 11
  next: E2E_VERIFY
  canSkipTo: null
  autoFlow: false
  threeStepMode: true
- id: E2E_VERIFY
  name: 端到端链路验证
  order: 12
  next: TEST
  canSkipTo: null
  autoFlow: false
  threeStepMode: true
- id: TEST
  name: 测试验证
  order: 13
  next: ARCHIVE
  canSkipTo: null
  autoFlow: false
  threeStepMode: true
- id: ARCHIVE
  name: 完成归档
  order: 14
  next: DONE
  canSkipTo: null
  autoFlow: false
  threeStepMode: true
- id: DONE
  name: 已完成
  order: 15
  next: null
  canSkipTo: null
  autoFlow: true
  threeStepMode: false
rules:
  forward: 新的 currentPhase 必须是当前阶段的 transitions[current].next 或 transitions[current].canSkipTo（当澄清条件满足时）
  skipCondition: canSkipTo 仅在澄清阶段自动跳过条件满足时可用（无 pending 问题 / 前置阶段已 skipped）
  rollback: BUILD_VERIFY → IMPLEMENT 和 VISUAL_REVIEW → IMPLEMENT 的回退是允许的回退到非直接前驱阶段的特例，其他阶段只能回退到直接前驱
  termination: 只有 ARCHIVE 阶段的 archiver Agent 才能将 currentPhase 设为 DONE
