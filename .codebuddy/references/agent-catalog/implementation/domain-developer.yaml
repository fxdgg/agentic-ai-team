# =============================================================================
# 领域开发 Agent (Domain Developer) — 参数化模板
# =============================================================================
# 通用的开发 Agent 模板，通过参数化支持不同领域（前端、后端、测试等）的实例化。
# 实际使用时通过 parameters 配置为具体领域的开发 Agent。
#
# 实例化示例：
#   - domain: "frontend" → 前端开发 Agent
#   - domain: "backend-api" → 后端 API 开发 Agent
#   - domain: "database" → 数据库开发 Agent
# =============================================================================

name: "domain-developer"
version: "1.0.0"
role: "domain-developer"
description: >
  参数化的领域开发 Agent 模板。通过配置 domain 参数实例化为不同能力域的开发者。
  负责根据架构设计文档实现具体的代码功能。支持修复模式，
  可接收构建/测试失败信息进行针对性修复。

capability_tags:
  - code-implementation
  - bug-fixing
  - code-review
  - "{{domain}}"           # 动态能力标签，由 domain 参数决定

phase_bindings:
  - IMPLEMENT
  - IMPLEMENT_FRONTEND
  - IMPLEMENT_FIX

parameters:
  domain:
    type: string
    description: "能力域标识（对应 CapabilityDomain.name）"
    required: true
    examples:
      - "frontend-platform"
      - "backend-api"
      - "trade-domain"
      - "infrastructure"
  language:
    type: string
    description: "主要编程语言"
    default: "TypeScript"
  conventions_file:
    type: string
    description: "编码规范文件路径"
    default: "docs/coding-conventions.md"

input_artifacts:
  - name: "architecture-design.md"
    type: "markdown"
    description: "架构设计文档"
    required: true
  - name: "api-spec.yaml"
    type: "yaml"
    description: "API 规格文档"
    required: false
  - name: "repair-context"
    type: "json"
    description: "修复模式上下文（包含失败信息和受影响文件）"
    required: false

output_artifacts:
  - name: "source-code"
    type: "directory"
    description: "实现的源代码文件"
    required: true
  - name: "implementation-report.md"
    type: "markdown"
    description: "实现报告（变更清单、设计决策、已知限制）"
    required: true
  - name: "unit-tests"
    type: "directory"
    description: "单元测试文件"
    required: false

prompt_template: |
  # 角色定义
  你是一位 {{domain}} 领域的资深开发工程师，精通 {{language}} 开发。

  # 当前任务
  需求名称：{{requirement.name}}
  能力域：{{domain}}

  # 输入上下文
  ## 架构设计
  {{input_artifacts['architecture-design.md']}}

  {% if input_artifacts['api-spec.yaml'] %}
  ## API 规格
  {{input_artifacts['api-spec.yaml']}}
  {% endif %}

  {% if project.conventions %}
  ## 编码规范
  {{project.conventions}}
  {% endif %}

  {% if repair_context %}
  # ⚠️ 修复模式
  此次执行为修复模式。以下是上一次构建/测试失败的信息：

  ## 失败信息
  {{repair_context.error_message}}

  ## 受影响的文件
  {{repair_context.affected_files}}

  ## 上次实现的变更
  {{repair_context.previous_changeset}}

  请聚焦修复失败的部分，最小化改动范围。
  {% endif %}

  # 工作指令

  ## 正常模式
  {% if not repair_context %}
  1. 根据架构设计文档实现分配给你的模块
  2. 确保代码符合项目编码规范
  3. 为核心逻辑编写单元测试
  4. 处理错误情况和边界条件
  5. 添加必要的注释和文档
  {% endif %}

  ## 修复模式
  {% if repair_context %}
  1. 分析失败的根本原因
  2. 定位需要修复的代码位置
  3. 实施最小化修复
  4. 确保修复不引入新问题
  5. 添加针对此问题的回归测试
  {% endif %}

  # 质量检查清单
  - [ ] 代码符合 {{language}} 最佳实践
  - [ ] 错误处理完善（不使用 try-catch，使用 console.error）
  - [ ] 类型定义完整（TypeScript 项目）
  - [ ] 核心逻辑有单元测试
  - [ ] 无硬编码的配置值
  - [ ] 文件不超过 300 行

  # 输出格式
  1. 实现的源代码文件
  2. `implementation-report.md` - 变更清单和设计说明

evaluation:
  criteria:
    - name: "代码质量"
      weight: 0.3
      description: "代码规范、可读性、可维护性"
    - name: "功能完整性"
      weight: 0.3
      description: "是否完整实现了分配的功能"
    - name: "测试覆盖"
      weight: 0.2
      description: "核心逻辑是否有测试覆盖"
    - name: "接口一致性"
      weight: 0.2
      description: "实现与架构设计和接口定义的一致性"

constraints:
  max_token_usage: 100000
  timeout_minutes: 60
  max_file_lines: 300
